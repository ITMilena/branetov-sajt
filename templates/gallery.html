<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" aria-hidden="true" style="display:none;">
  <button class="lightbox__close" type="button">✕</button>
  <button class="lightbox__prev" type="button">‹</button>
  <button class="lightbox__next" type="button">›</button>

  <div class="lightbox__content">
    <img class="lightbox__img" src="" alt="">
    <div class="lightbox__cap"></div>
  </div>
</div>

<style>
  .gfilter{
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06);
    color: #fff;
    cursor: pointer;
  }
  .gfilter.is-active{
    background: rgba(120,100,255,.35);
    border-color: rgba(120,100,255,.6);
  }
</style>

<script>
  // ===== FILTER (bez "Sve") =====
  const filterBtns = document.querySelectorAll(".gfilter");
  const allItems = Array.from(document.querySelectorAll(".gitem"));

  function applyFilter(cat) {
    allItems.forEach(el => {
      const cats = (el.dataset.cat || "").split(" ").filter(Boolean);
      const show = cats.includes(cat);
      el.style.display = show ? "" : "none";
      el.classList.toggle("is-hidden", !show);
    });
  }

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filterBtns.forEach(b => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      applyFilter(btn.dataset.filter);
    });
  });

  // default: Krovovi
  applyFilter("krovovi");

  // ===== LIGHTBOX (samo kroz vidljive slike) =====
  const lb = document.getElementById("lightbox");
  const lbImg = lb.querySelector(".lightbox__img");
  const lbCap = lb.querySelector(".lightbox__cap");
  const btnClose = lb.querySelector(".lightbox__close");
  const btnPrev = lb.querySelector(".lightbox__prev");
  const btnNext = lb.querySelector(".lightbox__next");

  let currentIndex = -1;

  function visibleItems() {
    return allItems.filter(el => !el.classList.contains("is-hidden") && el.style.display !== "none");
  }

  function openLightbox(item) {
    const vis = visibleItems();
    currentIndex = vis.indexOf(item);
    if (currentIndex < 0) currentIndex = 0;

    lbImg.src = item.dataset.full;
    lbImg.alt = item.dataset.cap || "";
    lbCap.textContent = item.dataset.cap || "";

    lb.style.display = "flex";
    lb.setAttribute("aria-hidden", "false");
  }

  function closeLightbox() {
    lb.style.display = "none";
    lb.setAttribute("aria-hidden", "true");
    lbImg.src = "";
    lbCap.textContent = "";
    currentIndex = -1;
  }

  function showByIndex(i) {
    const vis = visibleItems();
    if (!vis.length) return;
    if (i < 0) i = vis.length - 1;
    if (i >= vis.length) i = 0;

    currentIndex = i;
    const item = vis[currentIndex];

    lbImg.src = item.dataset.full;
    lbImg.alt = item.dataset.cap || "";
    lbCap.textContent = item.dataset.cap || "";
  }

  allItems.forEach(item => item.addEventListener("click", () => openLightbox(item)));
  btnClose.addEventListener("click", closeLightbox);
  btnPrev.addEventListener("click", () => showByIndex(currentIndex - 1));
  btnNext.addEventListener("click", () => showByIndex(currentIndex + 1));

  document.addEventListener("keydown", (e) => {
    if (lb.getAttribute("aria-hidden") === "true") return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") showByIndex(currentIndex - 1);
    if (e.key === "ArrowRight") showByIndex(currentIndex + 1);
  });

  lb.addEventListener("click", (e) => { if (e.target === lb) closeLightbox(); });
</script>
